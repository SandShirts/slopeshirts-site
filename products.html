<style>
@font-face {
  font-family: 'Porcelain';
  src: url('fonts/Porcelain.ttf') format('truetype');
  font-display: swap;
}

@font-face {
  font-family: 'Magnolia Script';
  src: url('fonts/MagnoliaScript.ttf') format('truetype');
  font-display: swap;
}
:root {
  --gold:#ff8a3d; --coral:#1f8fd6; --navy:#10231c; --ocean:#1a7fa0; --sand:#f0dfa8; --foam:#f1f5f2;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family: Arial, sans-serif;
  color:var(--navy);
  background: linear-gradient(180deg,#c9dbe3 0%,#dde8ec 30%,#eef3f4 62%,#ffffff 100%);
  background-attachment: fixed;
}
.page { max-width: 1380px; margin: 0 auto; padding: 24px 22px 60px; }
.hero {
  display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:18px;
}
.hero h1 {
  margin:0 0 18px 0;
  font-family:'Skyo','Porcelain',cursive;
  font-size:clamp(42px,5.2vw,86px);
  line-height:1.18;
  color:#fff;
  text-shadow:0 4px 32px rgba(0,0,0,.35);
}
.hero p {
  margin:8px 0 0; color:#ff8a3d; font-weight:800;
}
.layout {
  display:grid; grid-template-columns: minmax(420px, 1.05fr) minmax(360px, .95fr); gap:26px; align-items:start;
}
.preview-shell {
  position: sticky; top:18px;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(8px);
  border:1px solid rgba(255,255,255,.6);
  border-radius:28px;
  box-shadow:0 18px 40px rgba(16,35,28,.16);
  padding:22px;
}
.preview-stage {
  position:relative; width:100%; aspect-ratio: 4/5; overflow:hidden;
  background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.92), rgba(255,255,255,.55) 65%, rgba(255,255,255,.45));
  border-radius:22px;
}

.garment-color-layer{display:none;}
.preview-stage img.garment {
  position:relative;
  z-index:1;
  width:100%; height:100%; object-fit:contain; display:block;
}
.preview-stage .design-group {
  z-index:3;
}
.design-group {
  position:absolute; left:50%; transform:translateX(-50%); width:40%;
  display:flex; flex-direction:column; align-items:center; pointer-events:none;
}
.design-group img {
  width:100%; height:auto; display:block; filter:url('#design-tint'); margin-bottom:-6px;
}
.design-town {
  font-family:'Porcelain','Brush Script MT',cursive;
  margin-top:-28px; line-height:.82; white-space:nowrap; text-align:center; color:#1a1a1a;
  font-size: clamp(34px, 3.8vw, 54px);
}
.preview-meta {
  display:flex; justify-content:space-between; gap:16px; align-items:center; margin-top:16px;
  font-size:1.05rem; font-weight:700;
}
.preview-name { font-size:1.25rem; font-weight:800; }
.design-name-badge {
  display:inline-flex;
  margin-top:7px;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(255,138,61,.22);
  border:1px solid rgba(16,35,28,.12);
  color:var(--navy);
  font-size:.9rem;
  font-weight:900;
  letter-spacing:.01em;
}
.controls {
  background: rgba(255,255,255,.8); border-radius:28px; padding:22px;
  box-shadow:0 18px 40px rgba(16,35,28,.16);
}
.grid { display:grid; grid-template-columns:1fr; gap:18px; }
.card {
  background:linear-gradient(180deg, rgba(240,248,255,.96), rgba(204,238,248,.90)); border-radius:20px; padding:18px; box-shadow:0 10px 24px rgba(16,35,28,.08);
}

.product-description-card { grid-column: 1 / -1; }
.product-description-card p { margin:0; color:#314657; font-size:.92rem; line-height:1.38; font-weight:700; }
.product-description-card .product-specs { margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.product-description-card .product-specs span { border:1px solid rgba(16,35,28,.12); background:rgba(255,138,61,.16); color:var(--navy); padding:5px 9px; border-radius:999px; font-size:.76rem; font-weight:900; line-height:1.15; }

.size-chart-link { border:0; background:transparent; color:var(--navy); font-weight:950; text-decoration:underline; cursor:pointer; padding:8px 0; font-size:.95rem; }
.size-chart-link:hover { color:var(--coral); }
.size-chart-wrap { margin-top:16px; overflow-x:auto; }
.size-chart-title { margin:0 0 10px; color:var(--navy); font-size:1rem; font-weight:900; }
.size-chart { width:100%; border-collapse:collapse; background:rgba(255,255,255,.82); border-radius:14px; overflow:hidden; }
.size-chart th, .size-chart td { border:1px solid rgba(16,35,28,.16); padding:9px 10px; text-align:center; font-weight:750; color:var(--navy); }
.size-chart th { background:rgba(255,138,61,.26); font-weight:950; }
.size-chart-note { margin:8px 0 0; color:#5a6a78; font-size:.82rem; font-weight:700; }

.card h3 { margin:0 0 12px; color:var(--gold); font-size:1.1rem; font-weight:900; }
.product-description-card { padding-top:14px; padding-bottom:14px; }
.fixed-placement { display:inline-block; padding:10px 16px; border-radius:999px; background:var(--navy); color:#fff; font-weight:900; margin-bottom:8px; }
.fixed-placement-note { color:#5a6a78; font-size:.92rem; font-weight:800; }
.pills, .swatches {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.pill, .swatch, .size-btn, .placement-btn {
  border:2px solid rgba(16,35,28,.12); border-radius:999px; cursor:pointer; transition:.18s ease;
}
.pill {
  padding:10px 14px; background:#fff; font-weight:700;
}
.pill.active, .size-btn.active, .placement-btn.active {
  background:var(--navy); color:#fff; border-color:var(--navy);
}
.swatch {
  display:flex; align-items:center; gap:10px; padding:10px 14px; background:#fff; font-weight:800;
}
.swatch-color {
  width:52px; height:52px; border-radius:50%; border:1px solid rgba(0,0,0,.20); background-size:cover; background-position:center;
}
.swatch.active { border-color:var(--navy); box-shadow:0 0 0 3px rgba(16,35,28,.08); }
.swatch.forever-swatch { padding:12px 16px; font-size:.95rem; }
.swatch.forever-swatch .swatch-color { width:74px; height:74px; }
.sizes { display:flex; flex-wrap:wrap; gap:10px; }
.size-btn, .placement-btn { padding:9px 14px; background:#fff; font-weight:700; }
.help { color:#5a6a78; font-size:.92rem; margin-top:8px; }
#designColorHelp { color:var(--navy); font-size:1.12rem; font-weight:900; letter-spacing:.02em; }
.actions { margin-top:18px; display:flex; flex-direction:column; gap:12px; }
.primary-btn {
  border:none; border-radius:18px; padding:16px 18px; font-size:1rem; font-weight:800; cursor:pointer;
  background:var(--coral); color:#fff; box-shadow:0 12px 24px rgba(31,143,214,.28);
}
.secondary-line { font-size:1rem; font-weight:800; }
@media (max-width: 980px) {
  .layout { grid-template-columns:1fr; }
  .preview-shell { position:static; }
}

.hero-actions {

.price-card {

  .card { padding: 13px; border-radius: 16px; }
  .card h3 { font-size:1rem; margin-bottom:9px; }
  .pills, .swatches, .sizes { gap:8px; }
  .pill, .swatch, .size-btn, .placement-btn { min-height: 42px; font-size:.88rem; }
  .pill { padding: 9px 11px; }
  .swatch { padding: 8px 10px; }

  .primary-btn, .continue-cart-btn { min-height: 50px; font-size:.95rem; }
  .price-value { font-size: 1.55rem !important; }
  /* Product artwork uses desktop geometry as the source of truth on mobile.
     Do not override shirt/tank/hoodie placement here; JS scales text to the print area. */
  /* v42: blanket mobile only uses the same print geometry as the approved desktop blanket.
     This restores the blanket design to the lower-left print area instead of shifting it high/small. */
  .preview-stage.product-beach_blanket .design-group { left: 24% !important; top: 58% !important; width: 25% !important; }
  /* v48 mobile-only blanket tune: keep the approved circle/logo in place and place the words just below the circle without overlap. */

    font-size: clamp(11px, 2.9vw, 17px) !important;
    margin-top: 0px !important;
    transform: translateY(0%) !important;
  }
  .preview-stage.product-pajama_pants .design-group { left: 58.8% !important; top: 49.5% !important; }
}
@media (max-width: 520px) {
  .swatch.forever-swatch .swatch-color { width:56px; height:56px; }
}

@media (max-width: 420px) {
  .page { padding-left:8px; padding-right:8px; }
  .hero h1 { font-size:1.75rem; }
  .pill, .swatch, .size-btn, .placement-btn { font-size:.82rem; }
  .preview-stage { max-height: 52vh; }
}



/* v40: final mobile-only product preview tune. Desktop placement remains untouched.
   - Shirts/tanks/hoodies: keep desktop circle size, place town below circle, shrink text until it fits.
   - Pajamas: compact rotated town text so it does not run far down the leg. */

      product: currentProduct,

function hexToRgb(hex) {
  const clean = hex.replace('#','');
  const num = parseInt(clean, 16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function setDesignTint(hex) {
  const c = hexToRgb(hex);
  document.getElementById('design-tint-matrix').setAttribute('values',
   `0 0 0 0 ${c.r/255}  0 0 0 0 ${c.g/255}  0 0 0 0 ${c.b/255}  0 0 0 1 0`);
}
function townFontSize(text) {
  const len = (text || '').length;
  const mobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
  if (mobile) {
    // Start conservative on mobile; final fitting happens in fitTownTextToPreview().
    if (len <= 8) return '34px';
    if (len <= 12) return '28px';
    if (len <= 16) return '22px';
    if (len <= 20) return '18px';
    return '15px';
  }
  if (len <= 8) return '56px';
  if (len <= 12) return '48px';
  if (len <= 16) return '40px';
  if (len <= 20) return '34px';
  return '30px';
}
function fitTownTextToPreview() {
  if (!el || !el.designTown || !el.designGroup || !el.previewStage) return;
  if (currentProduct === 'beach_blanket' || currentProduct === 'pajama_pants') return;
  const groupRect = el.designGroup.getBoundingClientRect();
  const stageRect = el.previewStage.getBoundingClientRect();
  if (!groupRect.width || !stageRect.width) return;
  const mobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;

  // The town must sit below the circle and fit inside the safe print area.
  // On mobile we use the circle width as the boundary and shrink aggressively until full text shows.
  const maxWidth = groupRect.width * (mobile ? 0.97 : 1.16);
  let size = parseFloat(el.designTown.style.fontSize) || (mobile ? 24 : 34);
  const minSize = mobile ? 10 : 18;

  el.designTown.style.maxWidth = maxWidth + 'px';
  el.designTown.style.overflow = 'visible';
  el.designTown.style.whiteSpace = 'nowrap';
  el.designTown.style.display = 'block';

  let guard = 0;
  while (el.designTown.scrollWidth > maxWidth && size > minSize && guard < 40) {
    size -= mobile ? 1 : 1.5;
    el.designTown.style.fontSize = size + 'px';
    guard++;
  }

  // Last safety pass: if a very long town still risks exceeding the print zone, compress a little.
  if (mobile && el.designTown.scrollWidth > maxWidth) {
    const scale = Math.max(0.64, maxWidth / Math.max(el.designTown.scrollWidth, 1));
    el.designTown.style.transform = `scaleX(${scale})`;
    el.designTown.style.transformOrigin = 'center center';
  } else {
    el.designTown.style.transform = '';
    el.designTown.style.transformOrigin = '';
  el.designTown.style.fontWeight = '';
  }
}
function queuePreviewFit() {
  requestAnimationFrame(() => {
    fitTownTextToPreview();
    requestAnimationFrame(fitTownTextToPreview);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => requestAnimationFrame(fitTownTextToPreview));
  }
}
function titleCase(s) {
  return s.replace(/\s+/g,' ').trim().split(' ').map(w => w ? w[0].toUpperCase()+w.slice(1).toLowerCase() : '').join(' ');
}
currentTown = titleCase(currentTown.replace(/\+/g, ' '));

function sizeChartHtml(info) {
  if (!info || !info.sizeChart) return '';
  return `<div class="size-chart-wrap"><table class="size-chart"><thead><tr>${info.sizeChart.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${info.sizeChart.rows.map(r => `<tr>${r.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="size-chart-note">Measurements are approximate. Body width is measured flat across the chest.</p></div>`;
}
function renderProductDescription() {
  const info = PRODUCT_DESCRIPTIONS[currentProduct];
  if (!el.productDescriptionText || !el.productSpecs) return;
  if (!info) {
    el.productDescriptionText.textContent = 'Product details coming soon.';
    el.productSpecs.innerHTML = '';
    if (el.sizeChartLink) el.sizeChartLink.style.display = 'none';
    return;
  }
  el.productDescriptionText.textContent = info.description;
  let html = (info.specs || []).map(s => `<span>${s}</span>`).join('');
  el.productSpecs.innerHTML = html;
  if (el.sizeChartLink) {
    el.sizeChartLink.style.display = info.sizeChart ? 'inline-block' : 'none';
    el.sizeChartLink.textContent = 'View Size Chart';
  }
}
function openSizeChart() {
  const info = PRODUCT_DESCRIPTIONS[currentProduct];
  if (!info || !info.sizeChart || !el.sizeChartModal) return;
  el.sizeChartModalTitle.textContent = info.sizeChart.title;
  el.sizeChartModalBody.innerHTML = sizeChartHtml(info);
  el.sizeChartModal.classList.add('open');
  el.sizeChartModal.setAttribute('aria-hidden','false');
}
function closeSizeChart() {
  if (!el.sizeChartModal) return;
  el.sizeChartModal.classList.remove('open');
  el.sizeChartModal.setAttribute('aria-hidden','true');
}
if (el.sizeChartLink) el.sizeChartLink.addEventListener('click', openSizeChart);
if (el.sizeChartClose) el.sizeChartClose.addEventListener('click', closeSizeChart);
if (el.sizeChartModal) el.sizeChartModal.addEventListener('click', (e) => { if (e.target === el.sizeChartModal) closeSizeChart(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSizeChart(); });

function renderProducts() {
  el.productPills.innerHTML = '';
  Object.entries(PRODUCTS).forEach(([id, p]) => {
    const b = document.createElement('button');
    b.className = 'pill' + (id===currentProduct ? ' active' : '');
    b.textContent = p.label;
    b.onclick = () => {
      currentProduct = id;
      currentApparelColor = PRODUCTS[id].defaultColor;
      currentPlacement = PRODUCTS[id].placement === 'back' ? 'back' : 'front';
      currentViewSide = PRODUCTS[id].defaultView || 'front';
      currentSize = PRODUCTS[id].defaultSize || PRODUCTS[id].sizes[0];
      renderAll();
    };
    el.productPills.appendChild(b);
  });
}

function renderApparelColors() {
  el.apparelSwatches.innerHTML = '';
  el.apparelSwatches.className = 'swatches apparel-grid-' + currentProduct;
  const conf = PRODUCTS[currentProduct];
  Object.keys(conf.colors).forEach(colorName => {
    const btn = document.createElement('button');
    btn.className = 'swatch' + (colorName===currentApparelColor ? ' active' : '');
    btn.classList.add('forever-swatch');
    const swatchImg = (APPAREL_SWATCH_IMAGES[currentProduct] && APPAREL_SWATCH_IMAGES[currentProduct][colorName]) ? APPAREL_SWATCH_IMAGES[currentProduct][colorName] : null;
    const swatch = APPAREL_SWATCH_HEX[colorName] || '#ddd';
    const swatchStyle = swatchImg ? `background-image:url('${swatchImg}');` : `background:${swatch};`;
    btn.innerHTML = `<span class="swatch-color" style="${swatchStyle}"></span><span class="swatch-label">${colorName}</span>`;
    btn.onclick = () => { currentApparelColor = colorName; renderAll(); };
    el.apparelSwatches.appendChild(btn);
  });
  el.apparelColorHelp.textContent = currentApparelColor;
}

function renderPlacement() {
  el.placementButtons.innerHTML = '';
  const rule = PRODUCTS[currentProduct].placement;

  if (currentProduct === 'beach_blanket') {
    el.placementButtons.innerHTML = '<div class="fixed-placement">Front Corner</div><div class="fixed-placement-note">(Fixed placement for blankets)</div>';
  } else {
    ((currentProduct === 'pajama_pants') ? ['front'] : ['front','back']).forEach(side => {
      const btn = document.createElement('button');
      btn.className = 'placement-btn' + (side===currentViewSide ? ' active' : '');
      btn.textContent = side[0].toUpperCase()+side.slice(1);
      btn.onclick = () => { currentViewSide = side; renderAll(); };
      el.placementButtons.appendChild(btn);
    });
  }

  if (rule === 'front') {
    currentPlacement = 'front';
    if (currentProduct === 'beach_blanket') {
      currentViewSide = 'front';
      el.placementHelp.classList.add('blanket-note');
      el.placementHelp.innerHTML = `Preview text says “Your Happy Place.” Your finished blanket will be printed with your selected town: <span class="selected-town">${currentTown}</span>.`;
    } else {
      el.placementHelp.classList.remove('blanket-note');
      el.placementHelp.textContent = currentProduct === 'pajama_pants'
        ? 'Town name prints on the front pant leg.'
        : 'Design is front only. Use the buttons to view the front or back of the garment.';
    }
  } else if (rule === 'back') {
    currentPlacement = 'back';
    el.placementHelp.classList.remove('blanket-note');
    el.placementHelp.textContent = currentProduct === 'zip_up'
      ? 'Design is back only. All zippers and drawstrings are white. Use the buttons to view the front or back.'
      : 'Design is back only. Use the buttons to view the front or back of the garment.';
  } else {
    currentPlacement = currentViewSide;
    if (currentProduct === 'beach_blanket') {
      el.placementHelp.classList.add('blanket-note');
      el.placementHelp.innerHTML = `Preview text says “Your Happy Place.” Your finished blanket will be printed with your selected town: <span class="selected-town">${currentTown}</span>.`;
    } else {
      el.placementHelp.classList.remove('blanket-note');
      el.placementHelp.textContent = 'Choose one side only.';
    }
  }
}

function renderPreview() {
  const product = PRODUCTS[currentProduct];
  const sideToShow = currentViewSide || currentPlacement;
  el.previewStage.className = 'preview-stage product-' + currentProduct;
  const imgSrc = IMAGES[currentProduct][currentApparelColor][sideToShow];
  el.garment.src = imgSrc;
  el.garment.alt = product.label + ' ' + sideToShow + ' in ' + currentApparelColor;
  el.productName.textContent = product.label;
  if (el.productPrice) el.productPrice.textContent = formatMoney(PRODUCT_PRICES[currentProduct]);
  el.placementReadout.textContent = sideToShow[0].toUpperCase()+sideToShow.slice(1) + ' · ' + currentSize;

  el.designOverlay.src = `Designs/${currentDesign}.png`;
  const blanketSampleTown = 'Your Happy Place';
  const displayTown = currentProduct === 'beach_blanket' ? blanketSampleTown : currentTown;
  el.designTown.textContent = displayTown;

  // Reset any inline style overrides from product-specific previews.
  // Pajama pants uses a different font/outline; without this reset it leaks into shirts/hoodies/tanks.
  el.designTown.style.fontFamily = '';
  el.designTown.style.fontSize = '';
  el.designTown.style.color = '';
  el.designTown.style.margin = '';
  el.designTown.style.lineHeight = '';
  el.designTown.style.whiteSpace = '';
  el.designTown.style.textAlign = '';
  el.designTown.style.letterSpacing = '';
  el.designTown.style.webkitTextStroke = '';
  el.designTown.style.textShadow = '';
  el.designTown.style.paintOrder = '';
  el.designTown.style.maxWidth = '';
  el.designTown.style.overflow = '';
  el.designTown.style.transform = '';
  el.designTown.style.transformOrigin = '';
  el.designTown.style.fontWeight = '';

  if (currentProduct === 'beach_blanket') {
    el.designTown.style.fontSize = 'clamp(12px, 1.55vw, 21px)';
    el.designTown.style.marginTop = '4px';
    el.designTown.style.transform = 'translateY(6%)';
    el.designTown.style.color = currentDesignColor;
  } else if (currentProduct === 'pajama_pants') {
    const townLen = currentTown.length;
    const mobilePajama = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    if (mobilePajama) {
      // Keep pajama lettering compact so long towns do not run down the pant leg.
      el.designTown.style.fontSize = townLen <= 8 ? '18px' : townLen <= 14 ? '15.5px' : townLen <= 20 ? '13px' : '11.5px';
    } else {
      el.designTown.style.fontSize = townLen <= 8 ? '34px' : townLen <= 14 ? '28px' : townLen <= 20 ? '23px' : '20px';
    }
    el.designTown.style.fontFamily = "'Magnolia Script','Skyo','Brush Script MT',cursive";
    el.designTown.style.fontWeight = '900';
    el.designTown.style.color = currentDesignColor;
    el.designTown.style.webkitTextStroke = '0';
    el.designTown.style.textShadow = 'none';
    el.designTown.style.paintOrder = 'normal';
  } else {
    el.designTown.style.fontSize = townFontSize(currentTown);
    el.designTown.style.color = currentDesignColor;
    if (currentProduct === 'womens_crop_hoodie') {
      el.designTown.style.marginTop = '-22px';
    }
  }
  setDesignTint(currentDesignColor);
  el.garmentColorLayer.style.display='none';

  const cfg = PLACEMENT_CFG[currentProduct][sideToShow] || PLACEMENT_CFG[currentProduct].front || PLACEMENT_CFG[currentProduct].back;
  let designTop = cfg.top;
  el.designGroup.style.top = designTop;
  el.designGroup.style.width = cfg.circle;

  const rule = product.placement;
  const shouldShowDesign = (rule === 'both' || rule === sideToShow);
  el.designGroup.style.display = shouldShowDesign ? 'flex' : 'none';
  queuePreviewFit();
  saveSelectionState();

  if (currentProduct === 'beach_blanket') {
    el.placementHelp.classList.add('blanket-note');
      el.placementHelp.innerHTML = `Preview text says “Your Happy Place.” Your finished blanket will be printed with your selected town: <span class="selected-town">${currentTown}</span>.`;
  }
  const summaryDesignColor = (DESIGN_COLORS.find(c => c.hex.toLowerCase()===currentDesignColor.toLowerCase())||{name:currentDesignColor}).name;
  el.designNameBadge.textContent = `Design: ${getDesignName(currentDesign)}`;
  if (el.zipInfoBadge) { el.zipInfoBadge.hidden = currentProduct !== 'zip_up'; }
  el.summary.textContent = '';
}

function renderAll() {
  renderProducts();
  renderProductDescription();
  renderApparelColors();
  renderDesignColors();
  renderSizes();
  renderPlacement();
  renderPreview();
}



function getCart(){
  try { return JSON.parse(localStorage.getItem('slopeshirts_cart') || '[]'); }
  catch(e){ return []; }
}
function saveCart(cart){
  localStorage.setItem('slopeshirts_cart', JSON.stringify(cart));
  updateCartCount();
}
function updateCartCount(){
  const total = getCart().reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
  if (el.cartCount) el.cartCount.textContent = total;
}
function addCurrentItemToCart(){
  const product = PRODUCTS[currentProduct];
  const designColorName = (DESIGN_COLORS.find(c => c.hex.toLowerCase()===currentDesignColor.toLowerCase())||{name:currentDesignColor}).name;
  const item = {
    productId: currentProduct,
    product: product.label,
    town: currentTown,
    design: currentDesign,
    designFile: currentDesign + '.png',
    designColor: currentDesignColor,
    designColorName,
    designName: getDesignName(currentDesign),
    apparelColor: currentApparelColor,
    productColor: currentApparelColor,
    manufacturerColor: product.manufacturerColors ? product.manufacturerColors[currentApparelColor] : currentApparelColor,
    size: currentSize,
    placement: currentProduct === 'beach_blanket' ? 'Front Corner' : currentPlacement,
    qty: 1,
    unitPrice: PRODUCT_PRICES[currentProduct]
  };
  const cart = getCart();
  const existing = cart.find(i => i.productId===item.productId && i.town===item.town && i.design===item.design && i.designColor===item.designColor && i.apparelColor===item.apparelColor && i.size===item.size && i.placement===item.placement);
  if (existing) existing.qty = (Number(existing.qty)||1) + 1;
  else cart.push(item);
  saveCart(cart);
  if (el.addedNote) {
    el.addedNote.textContent = 'Added to cart.';
    setTimeout(() => { el.addedNote.textContent = ''; }, 1800);
  }
}

if (el.changeDesignBtn) {
  el.changeDesignBtn.onclick = () => {
    const q = new URLSearchParams({
      town: currentTown,
      design: currentDesign,
      color: currentDesignColor
    });
    window.location.href = 'gallery.html?' + q.toString();
  };
}

el.continueBtn.onclick = () => {
  addCurrentItemToCart();
};
if (el.cartLinkBtn) {
  el.cartLinkBtn.onclick = () => { window.location.href = 'order.html'; };
}
if (el.goCartBtn) {
  el.goCartBtn.onclick = () => { window.location.href = 'order.html'; };
}
updateCartCount();
renderAll();
</script>
</body>
</html>
